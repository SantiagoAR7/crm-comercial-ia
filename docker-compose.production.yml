services:
  crm-api:
    build: ./backend
    container_name: cliente-crm-api
    restart: unless-stopped
    env_file: ./backend/.env.production
    volumes:
      - ./data:/app/data
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cliente-crm-api-ia.rule=Host(`crm.example.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.cliente-crm-api-ia.priority=100"
      - "traefik.http.routers.cliente-crm-api-ia.entrypoints=websecure"
      - "traefik.http.routers.cliente-crm-api-ia.tls.certresolver=letsencrypt"
      - "traefik.http.services.cliente-crm-api-ia.loadbalancer.server.port=4000"

  crm-web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "https://crm.example.com"
    restart: unless-stopped
    container_name: cliente-crm-web
    depends_on:
      - crm-api
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cliente-crm-web-ia.rule=Host(`crm.example.com`)"
      - "traefik.http.routers.cliente-crm-web-ia.priority=10"
      - "traefik.http.routers.cliente-crm-web-ia.entrypoints=websecure"
      - "traefik.http.routers.cliente-crm-web-ia.tls.certresolver=letsencrypt"
      - "traefik.http.services.cliente-crm-web-ia.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true
